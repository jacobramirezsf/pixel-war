<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pixel War">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Pixel War</title>
</head>
<body>
<div id="wrap">
  <div id="top">
    <span id="tl"></span>
    <span class="wave" id="wave"></span>
    <span id="cheatChip" class="hide">CHEATS</span><span id="topbtns"><button id="bPause" class="mini" title="pause (Space)">PAUSE</button><button id="bSpeed" class="mini" title="speed ([ and ])">1×</button><button id="bMenu" class="mini">MENU</button></span>
  </div>
  <div id="main">
    <div id="side"></div>
    <div id="stage">
      <canvas id="c"></canvas>
      <canvas id="mini"></canvas>
      <div id="viewctl"><button id="bZoomIn" class="vc" title="zoom in">+</button><button id="bZoomOut" class="vc" title="zoom out">−</button><button id="bFit" class="vc" title="fit the map">FIT</button><button id="bHome" class="vc" title="jump to base (F)">HOME</button></div>
      <div id="msg"></div>
      <button id="modechip" class="hide"></button>
      <button id="watchExit" class="hide">TAP TO SHOW THE CONTROLS</button>
      <div id="pauseov" class="hide"><div>PAUSED<small>tap or press Space to resume</small></div></div>
      <div id="cheats" class="hide"></div>
      <div id="eventcard" class="hide"><h3>EVENT</h3><p id="evText"></p><div class="row"><button id="evYes" class="gold">YES</button><button id="evNo">NO</button></div></div>
      <div id="terr" class="hide"></div>
      <div id="hints" class="hide"></div>
    </div>
  </div>
  <div id="bottom">
    <div id="panel">
      <div id="info"><span id="selcard"></span><span id="queue"></span></div>
      <div id="ctx" class="hide">
        <button id="bDesel" class="cx" title="deselect (Esc)"></button>
        <button id="bAct" class="cx act hide">ACT</button>
        <button id="bMove" class="cx st"></button>
        <button id="bAttack" class="cx st"></button>
        <button id="bGuard" class="cx st"></button>
        <button id="bHold" class="cx"></button>
        <button id="bRetreat" class="cx"></button>
      </div>
      <div id="tabpanel">
        <div id="armychips" class="chiprow hide">
          <button id="bSelect" class="chip">DRAG: PAN</button>
          <button id="bAll" class="chip">ALL</button>
          <button id="bCharge" class="chip">CHARGE</button>
          <button id="bG1" class="chip grp">G1</button>
          <button id="bG2" class="chip grp">G2</button>
          <button id="bG3" class="chip grp">G3</button>
          <button id="bRally" class="chip">RALLY</button>
        </div>
        <div id="bchips" class="chiprow hide">
          <button class="chip bc" data-bcat="town">TOWN</button>
          <button class="chip bc" data-bcat="military">MILITARY</button>
          <button class="chip bc" data-bcat="defense">DEFENSE</button>
          <button class="chip bc" data-bcat="ground">GROUND</button>
        </div>
        <div id="wchips" class="chiprow hide">
          <button id="bTerr" class="chip">KINGDOM LIST</button>
          <button id="bWatch" class="chip">WATCH</button>
          <span class="wsep">SHOW:</span>
          <span id="layerchips"></span>
        </div>
        <div id="strip" class="strip hide"></div>
        <div id="bstrip" class="strip hide">
          <button id="bSettle" class="tool"><span>VILLAGE</span><small>150</small></button>
          <button id="bOutpost" class="tool"><span>OUTPOST</span><small>50</small></button>
          <button id="bGrow" class="tool"><span>GROW</span></button>
          <button id="bFort" class="tool"><span>UPGRADE</span></button>
          <button id="bAbsorb" class="tool"><span>ABSORB</span><small>200</small></button>
        </div>
        <div id="pstrip" class="strip hide"></div>
        <div id="tstrip" class="strip hide"></div>
        <div id="more" class="grid hide">
          <button id="bSave">SAVE</button>
          <button id="bCheats" class="hide">CHEATS</button>
          <button id="bSell">REMOVE</button>
          <button id="bTeam">BLUE</button>
          <button id="bEdit">EDIT</button>
          <button id="bErase">ERASE</button>
          <button id="bMirror">MIRROR</button>
          <button id="bClear">CLEAR</button>
          <button id="bMap">MAP</button>
          <button id="bPlay">PLAY</button>
        </div>
        <div id="estrip" class="grid hide">
          <button id="bSize">SIZE</button>
          <button id="bRandom">RANDOM</button>
          <button id="bWild">WILD</button>
          <button id="bBrush">BRUSH 1</button>
          <button id="bMirrorMap">MIRROR</button>
          <button id="bClearMap">CLEAR</button>
          <button id="bCode">CODE</button>
          <button id="bDone">DONE</button>
        </div>
      </div>
      <div id="rail">
        <button id="tUnits" class="rb"><span>ARMY</span></button>
        <button id="tBuild" class="rb"><span>BUILD</span></button>
        <button id="tPowers" class="rb"><span>POWERS</span></button>
        <button id="tKingdom" class="rb"><span>KINGDOM</span></button>
        <button id="tWorld" class="rb"><span>WORLD</span></button>
        <button id="tMore" class="rb"><span>MORE</span></button>
        <button id="tTools" class="rb"><span>TERRAIN</span></button>
        <button id="tEdit" class="rb"><span>MAP</span></button>
      </div>
    </div>
  </div>
</div>
<div id="ov"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
