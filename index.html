<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<title>Pixel War</title>
</head>
<body>
<div id="wrap">
  <div id="top">
    <span id="tl"></span>
    <span class="wave" id="wave"></span>
    <span id="sel"></span>
    <button id="bMenu" class="mini">MENU</button>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="msg"></div>
  <div id="strip" class="strip"></div>
  <div id="bstrip" class="strip hide"></div>
  <div id="tstrip" class="strip hide"></div>
  <div id="cmd">
    <button id="bTeam">BLUE</button>
    <button id="bAll" class="cmd">ALL</button>
    <button id="bCharge" class="cmd">CHARGE</button>
    <button id="bHold" class="cmd">HOLD</button>
    <button id="bPause">PAUSE</button>
    <button id="bEdit">EDIT</button>
    <button id="bErase">ERASE</button>
    <button id="bMirror">MIRROR</button>
    <button id="bClear">CLEAR</button>
    <button id="bMap">MAP</button>
    <button id="bPlay">PLAY</button>
    <button id="bSize">SIZE</button>
    <button id="bRandom">RANDOM</button>
    <button id="bMirrorMap">MIRROR</button>
    <button id="bClearMap">CLEAR</button>
    <button id="bCode">CODE</button>
    <button id="bDone">DONE</button>
  </div>
</div>
<div id="ov"></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
